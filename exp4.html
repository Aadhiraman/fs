
<!DOCTYPE html>
<html ng-app="todoApp">

<head>
    <title>Angular To Do List</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #eee;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            list-style: none;
            background: #eee;
            padding: 10px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: red;
        }
    </style>
</head>

<body ng-controller="todoCtrl">

    <div class="box">

        <h2>My To Do List</h2>

        <input type="text"
               ng-model="newTask"
               placeholder="Enter a task">

        <button ng-click="addTask()">Add</button>

        <ul>
            <li ng-repeat="task in tasks">

                <span ng-class="{done: task.completed}"
                      ng-click="completeTask(task)">
                    {{task.name}}
                </span>

                <button class="delete"
                        ng-click="deleteTask($index)">
                    Delete
                </button>

            </li>
        </ul>

    </div>

<script>

var app = angular.module("todoApp", []);

app.controller("todoCtrl", function($scope) {

    $scope.tasks = [];

    $scope.addTask = function() {

        if ($scope.newTask && $scope.newTask.trim() !== "") {

            $scope.tasks.push({
                name: $scope.newTask.trim(),
                completed: false
            });

            $scope.newTask = "";
        }
    };

    $scope.deleteTask = function(index) {
        $scope.tasks.splice(index, 1);
    };

    $scope.completeTask = function(task) {
        task.completed = !task.completed;
    };

});

</script>
</body>
</html>
